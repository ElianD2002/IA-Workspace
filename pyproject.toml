[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ia-workspace"
version = "0.1.0b1"
description = "Gestor nativo de proyectos y orquestador de agentes de IA para Linux (GTK4 + Libadwaita)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Elian Martinez" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: User Interfaces",
]
# PyGObject, GTK 4, Libadwaita y VTE se toman del sistema (paquetes de la distribución).
# No se declaran aquí para no forzar compilación vía pip.
dependencies = []

[project.gui-scripts]
ia-workspace = "ia_workspace.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ia_workspace = ["ui/*.css"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
