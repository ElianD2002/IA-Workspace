  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

var(--fg)}\n.btn:hover{background:var(--btn-h)}\n.btn:focus-visible,.nrow:focus-visible,.row:focus-visible{outline:2px solid var(--accent-bg);outline-offset:-2px}\n.btn.flat{background:transparent}.btn.flat:hover{background:var(--hover)}\n.btn.icon{padding:0;width:34px}\n.btn.sm{height:28px;min-width:28px;font-size:13px;padding:0 10px}.btn.sm.icon{width:28px;padding:0}\n.btn.sug{background:var(--accent-bg);color:#fff}.btn.sug:hover{background:#4a90e8}\n.btn.dest{background:var(--err-a);color:var(--err)}.btn.dest-solid{background:#c01c28;color:#fff}\n.btn.pill{border-radius:999px;height:40px;padding:0 24px}\n.btn.on{background:var(--sel)}\n.linked{display:inline-flex;gap:1px}.linked>.btn{border-radius:0}.linked>.btn:first-child{border-radius:6px 0 0 6px}.linked>.btn:last-child{border-radius:0 6px 6px 0}\n.seg{display:inline-flex;background:var(--btn);border-radius:8px;padding:2px;gap:2px}.seg>.btn{height:28px;background:transparent;font-weight:600;font-size:13px;padding:0 12px}.seg>.btn.on{background:var(--hb);box-shadow:0 1px 2px rgba(0,0,0,.25)}\n.iaw.light .seg>.btn.on{background:#fff}\n/* estructura */\n.win{height:100vh;display:flex;overflow:hidden;position:relative}\n.sidebar{width:252px;flex:none;background:var(--sb);display:flex;flex-direction:column;border-right:1px solid var(--shade);min-height:0}\n.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--win);min-height:0}\n.hb{height:47px;flex:none;display:flex;align-items:center;gap:6px;padding:0 7px;background:var(--hb);border-bottom:1px solid var(--shade)}\n.sidebar .hb{background:var(--sb);border-bottom:0}\n.hb-t{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}\n.hb-t b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}\n.hb-t span{font-size:12px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}\n.scroll{overflow:auto;min-height:0}\n.page{flex:1;overflow:auto;min-height:0}\n.clamp{max-width:1040px;margin:0 auto;padding:28px 32px 96px}\n/* barra lateral */\n.nlist{display:flex;flex-direction:column;gap:2px;padding:0 6px}\n.nrow{height:38px;display:flex;align-items:center;gap:12px;padding:0 10px;border-radius:6px;border:0;background:transparent;width:100%;text-align:left;cursor:pointer;color:var(--fg)}\n.nrow:hover{background:var(--hover)}.nrow.on{background:var(--sel)}\n.nrow .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.sec{display:flex;align-items:center;justify-content:space-between;padding:14px 10px 6px 16px;font-size:12px;font-weight:700;color:var(--fg2)}\n.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;background:var(--btn)}\n.badge.warn{background:var(--warn-a);color:var(--warn)}.badge.acc{background:var(--accent-a);color:var(--accent)}\n.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--off)}\n.dot.working{background:var(--accent-bg);box-shadow:0 0 0 3px var(--accent-a)}.dot.wait{background:#e5a50a}.dot.done{background:#26a269}.dot.error{background:#e01b24}.dot.off{background:transparent;border:1.5px solid var(--off)}\n/* tarjetas y listas */\n.card{background:var(--card);border-radius:12px;box-shadow:0 0 0 1px var(--card-b),0 1px 2px rgba(0,0,0,.08)}\n.boxed{background:var(--card);border-radius:12px;box-shadow:0 0 0 1px var(--card-b),0 1px 2px rgba(0,0,0,.08);overflow:hidden}\n.row{min-height:54px;display:flex;align-items:center;gap:12px;padding:9px 14px;border:0;border-top:1px solid var(--sep);background:transparent;width:100%;text-align:left;color:var(--fg)}\n.row:first-child{border-top:0}\n.row.act{cursor:pointer}.row.act:hover{background:var(--hover)}.row.on{background:var(--sel)}\n.row .grow{flex:1;min-width:0}\n.row .ttl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.row .sub{font-size:12.5px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.grp-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:26px 0 10px}\n.grp-h:first-child{margin-top:0}\n/* estados */\n.st{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:700;white-space:nowrap;flex:none}\n.st.working{color:var(--accent);background:var(--accent-a)}.st.wait{color:var(--warn);background:var(--warn-a)}.st.done{color:var(--ok);background:var(--ok-a)}.st.error{color:var(--err);background:var(--err-a)}.st.off{color:var(--off);background:var(--btn)}.st.idle{color:var(--fg2);background:var(--btn)}\n.st .ic{width:12px;height:12px;-webkit-mask-size:12px;mask-size:12px}\n.spin{width:12px;height:12px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:iawspin .8s linear infinite;flex:none}\n.spin.lg{width:32px;height:32px;border-width:3px}\n@keyframes iawspin{to{transform:rotate(360deg)}}\n.pulse{animation:iawpulse 1.6s ease-in-out infinite}\n@keyframes iawpulse{50%{opacity:.45}}\n/* herramientas (monogramas, sin logos de marca) */\n.tool{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font:700 11px/1 \"JetBrains Mono\",monospace;color:#fff;flex:none;letter-spacing:-.02em}\n.tool.sm{width:22px;height:22px;border-radius:6px;font-size:9px}\n.tool.lg{width:44px;height:44px;border-radius:11px;font-size:14px}\n.t-cc{background:#b5501f}.t-cx{background:#6b3fa0}.t-ag{background:#1c6f80}.t-gpt{background:#2d7a52}.t-sh{background:#505057}\n/* chips */\n.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:13px;background:var(--btn);font-size:12.5px;font-weight:600;white-space:nowrap;border:0;color:var(--fg)}\n.chip .ic{width:12px;height:12px;-webkit-mask-size:12px;mask-size:12px}\n.kbd{font:600 11.5px/1 \"JetBrains Mono\",monospace;padding:3px 6px;border-radius:5px;background:var(--btn);box-shadow:inset 0 -1px 0 var(--shade);white-space:nowrap}\n/* paneles del workspace */\n.pane{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--view)}\n.pane-h{height:40px;flex:none;display:flex;align-items:center;gap:4px;padding:0 6px 0 14px;border-bottom:1px solid var(--sep)}\n.pane-h .hd{flex:1;min-width:0;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden}\n.handle{flex:none;width:1px;background:var(--shade);position:relative;cursor:col-resize}\n.handle::after{content:\"\";position:absolute;inset:0 -3px}\n.handle.h{width:auto;height:1px;cursor:row-resize}\n.term{background:var(--term);color:var(--term-fg);font:12.5px/1.65 \"JetBrains Mono\",ui-monospace,monospace;padding:12px 16px;overflow:auto;min-height:0;white-space:pre-wrap}\n.tl{display:flex;gap:10px}.tl .g{width:14px;flex:none;text-align:center}\n/* pestañas tipo AdwTabBar */\n.tabs{height:38px;flex:none;display:flex;align-items:center;gap:4px;padding:0 6px;border-bottom:1px solid var(--sep);background:var(--view);overflow-x:auto}\n.tab{height:30px;display:inline-flex;align-items:center;gap:8px;padding:0 12px;border-radius:6px;border:0;background:transparent;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--fg2)}\n.tab:hover{background:var(--hover)}.tab.on{background:var(--sel);color:var(--fg)}\n/* banner / toast */\n.banner{min-height:46px;display:flex;align-items:center;justify-content:center;gap:14px;padding:6px 14px;background:var(--warn-a);font-weight:600;flex:none;flex-wrap:wrap}\n.banner.info{background:var(--accent-a)}.banner.err{background:var(--err-a)}\n.toast{position:absolute;left:50%;bottom:72px;transform:translateX(-50%);background:var(--toast);color:#fff;border-radius:999px;padding:6px 6px 6px 20px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);z-index:60;font-weight:600;white-space:nowrap;animation:iawup .22s ease-out}\n.toast .btn{background:rgba(255,255,255,.12);color:#fff;height:30px}\n@keyframes iawup{from{opacity:0;transform:translate(-50%,10px)}}\n/* diálogos y popovers */\n.scrim{position:absolute;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;z-index:50;padding:24px;animation:iawfade .15s ease-out}\n@keyframes iawfade{from{opacity:0}}\n.dlg{background:var(--dlg);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;max-height:100%;min-height:0;overflow:hidden;width:100%;animation:iawpop .18s ease-out}\n@keyframes iawpop{from{opacity:0;transform:scale(.97)}}\n.dlg .hb{background:var(--dlg);border-bottom:1px solid var(--sep)}\n.alert{max-width:400px;padding:28px 24px 22px;text-align:center;gap:10px}\n.alert-btns{display:flex;flex-direction:column;gap:8px;margin-top:14px}\n.pop{position:absolute;background:var(--pop);border-radius:12px;box-shadow:var(--shadow),0 0 0 1px var(--shade);padding:6px;z-index:45;min-width:240px;animation:iawfade .12s ease-out}\n.mi{height:34px;display:flex;align-items:center;gap:12px;padding:0 12px;border-radius:6px;border:0;background:transparent;width:100%;text-align:left;cursor:pointer;color:var(--fg)}\n.mi:hover{background:var(--hover)}.mi .lbl{flex:1}\n.mi-sep{height:1px;background:var(--sep);margin:6px 4px}\n/* switch */\n.sw{width:46px;height:26px;border-radius:13px;background:var(--btn-h);position:relative;flex:none;border:0;cursor:pointer;padding:0}\n.sw::after{content:\"\";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.35);transition:transform .15s}\n.sw.on{background:var(--accent-bg)}.sw.on::after{transform:translateX(20px)}\n/* entrada */\n.entry{height:36px;border-radius:6px;background:var(--btn);display:flex;align-items:center;gap:8px;padding:0 10px;border:0;color:var(--fg);font:inherit;width:100%}\n.entry:focus-within{box-shadow:0 0 0 2px var(--accent-bg)}\n.ta{width:100%;border:0;resize:none;background:transparent;color:var(--fg);font:13.5px/1.6 \"JetBrains Mono\",ui-monospace,monospace;outline:none;padding:14px 16px;min-height:0;flex:1}\n/* estado vacío (AdwStatusPage) */\n.status{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:36px 24px;color:var(--fg)}\n.status .ic.xl{color:var(--fg2);opacity:.6;margin-bottom:10px}\n/* diff */\n.diff{font:12.5px/1.6 \"JetBrains Mono\",monospace;background:var(--term);overflow:auto;min-height:0}\n.dl{display:flex;white-space:pre}.dl .n{width:44px;flex:none;text-align:right;padding-right:10px;color:var(--fg2);opacity:.7;user-select:none}.dl .c{flex:1;padding-right:16px}\n.dl.add{background:rgba(38,162,105,.16)}.dl.del{background:rgba(192,28,40,.16)}.dl.hunk{color:var(--accent);background:var(--accent-a)}\n/* recorrido (capa del prototipo, no forma parte de la app) */\n.tour{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:70;display:flex;align-items:center;gap:4px;padding:5px;border-radius:999px;background:#0b0b0d;color:#fff;box-shadow:0 0 0 1.5px #e5a50a,0 10px 30px rgba(0,0,0,.5);max-width:calc(100% - 24px);overflow-x:auto}\n.tour .tag{font:700 10.5px/1 \"JetBrains Mono\",monospace;letter-spacing:.06em;color:#f8e45c;padding:0 10px 0 12px;white-space:nowrap}\n.tour .stp{height:30px;min-width:30px;border-radius:15px;border:0;background:rgba(255,255,255,.08);color:#fff;font-weight:700;font-size:12.5px;cursor:pointer;padding:0 10px;white-space:nowrap}\n.tour .stp:hover{background:rgba(255,255,255,.16)}.tour .stp.on{background:#f8e45c;color:#0b0b0d}\n.sim{display:inline-flex;align-items:center;gap:6px;font:700 10.5px/1 \"JetBrains Mono\",monospace;letter-spacing:.05em;color:var(--warn);border:1px dashed currentColor;border-radius:4px;padding:3px 6px;white-space:nowrap}\n/* adaptación */\n@media (max-width:1180px){.col-ctx{display:none}.col-ctx.force{display:flex}}\n@media (max-width:980px){.sidebar{display:none}.sb-alt .sidebar{display:flex;position:absolute;left:0;top:0;bottom:0;z-index:40;box-shadow:var(--shadow)}.col-chat{di ight: 12px; mask-size: 12px; -webkit-mask-size: 12px\"><\u002Fspan><span class=\"cap dim mono\" style=\"flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap\">chatgpt.com/c/…<\u002Fspan><span class=\"sim\">VISTA WEB SIMULADA<\u002Fspan><\u002Fdiv>\n          <div class=\"scroll\" style=\"flex: 1; padding: 14px 14px 8px; display: flex; flex-direction: column; gap: 14px\">\n            <sc-for list=\"{{ws.msgs}}\" as=\"m\" hint-placeholder-count=\"2\">\n              <div style=\"display: flex; flex-direction: column; gap: 6px\">\n                <span class=\"cap-hd dim\">{{m.who}}<\u002Fspan>\n                <div style=\"font-size: 13.5px; line-height: 1.55; padding: 10px 12px; border-radius: 10px; background: {{m.bg}}\">{{m.t}}\n                  <sc-if value=\"{{m.hasList}}\" hint-placeholder-val=\"{{ false }}\"><ol style=\"margin: 8px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px\"><sc-for list=\"{{m.list}}\" as=\"li\"><li>{{li}}<\u002Fli><\u002Fsc-for><\u002Fol><\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"padding: 10px; border-top: 1px solid var(--sep); display: flex; flex-direction: column; gap: 8px\">\n            <button class=\"btn sug\" sc-camel-on-click=\"{{useAsPrompt}}\"><span class=\"ic i-edit\"><\u002Fspan>Usar como base del prompt<\u002Fbutton>\n            <div style=\"display: flex; gap: 8px\"><button class=\"btn flat sm\" style=\"flex: 1\"><span class=\"ic i-copy\"><\u002Fspan>Copiar respuesta<\u002Fbutton><button class=\"btn flat sm\" style=\"flex: 1\" sc-camel-on-click=\"{{dlg.saveMemFromChat}}\"><span class=\"ic i-bookmark\"><\u002Fspan>Al Cerebro<\u002Fbutton><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsection>\n      <div class=\"handle col-chat\" role=\"separator\" aria-orientation=\"vertical\" title=\"Arrastra para ajustar\"><\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- Centro: prompt + sesiones -->\n    <section class=\"pane\" style=\"flex: 1; min-width: 0\">\n      <sc-if value=\"{{ws.showPrompt}}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"height: 236px; flex: none; display: flex; flex-direction: column; min-height: 0\">\n          <div class=\"pane-h\">\n            <div class=\"hd\"><span class=\"ic i-edit\"><\u002Fspan>Prompt <span class=\"cap dim\" style=\"font-weight: 400\">{{ws.promptMeta}}<\u002Fspan><\u002Fdiv>\n            <button class=\"btn flat sm\" sc-camel-on-click=\"{{go.library}}\">Biblioteca<\u002Fbutton>\n            <button class=\"btn flat sm icon\" aria-label=\"Más opciones del prompt\"><span class=\"ic i-more\"><\u002Fspan><\u002Fbutton>\n          <\u002Fdiv>\n          <textarea class=\"ta\" aria-label=\"Prompt para el agente\" placeholder=\"Describe la tarea para el agente. Puedes partir de una respuesta de ChatGPT o de una plantilla de la Biblioteca.\" value=\"{{ws.prompt}}\" sc-camel-on-change=\"{{onPrompt}}\"><\u002Ftextarea>\n          <div style=\"display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-top: 1px solid var(--sep); flex-wrap: wrap\">\n            <sc-for list=\"{{ws.ctxChips}}\" as=\"c\"><span class=\"chip\" title=\"Se adjunta como contexto\"><span class=\"ic {{c.icon}}\"><\u002Fspan>{{c.label}}<\u002Fspan><\u002Fsc-for>\n            <button class=\"chip\" style=\"cursor: pointer; background: transparent; box-shadow: inset 0 0 0 1px var(--sep)\"><span class=\"ic i-plus\"><\u002Fspan>Contexto<\u002Fbutton>\n            <span style=\"flex: 1\"><\u002Fspan>\n            <div style=\"position: relative\">\n              <button class=\"btn sm\" sc-camel-on-click=\"{{pop.agent}}\" aria-label=\"Elegir agente\"><span class=\"tool sm {{ws.pick.cls}}\">{{ws.pick.mono}}<\u002Fspan>{{ws.pick.name}}<span class=\"ic i-chev-down\"><\u002Fspan><\u002Fbutton>\n              <sc-if value=\"{{popIs.agent}}\" hint-placeholder-val=\"{{ false }}\">\n                <div class=\"pop\" style=\"right: 0; bottom: 38px; width: 300px\">\n                  <div class=\"cap-hd dim\" style=\"padding: 8px 12px 4px\">Asignar a<\u002Fdiv>\n                  <sc-for list=\"{{agentChoices}}\" as=\"a\">\n                    <button class=\"mi\" style=\"height: 50px; opacity: {{a.op}}\" sc-camel-on-click=\"{{a.pick}}\" disabled=\"{{a.disabled}}\">\n                      <span class=\"tool sm {{a.cls}}\">{{a.mono}}<\u002Fspan>\n                      <span class=\"lbl\" style=\"display: flex; flex-direction: column; line-height: 1.25\"><span style=\"font-weight: 600\">{{a.name}}<\u002Fspan><span class=\"cap dim\">{{a.sub}}<\u002Fspan><\u002Fspan>\n                      <sc-if value=\"{{a.sel}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"ic i-check acc\"><\u002Fspan><\u002Fsc-if>\n                    <\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <button class=\"btn sm sug\" sc-camel-on-click=\"{{dlg.assign}}\" title=\"Revisar y transferir (Ctrl+Enter)\">Transferir…<span class=\"ic i-send\"><\u002Fspan><\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"handle h\" role=\"separator\" aria-orientation=\"horizontal\"><\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- Sesiones -->\n      <div class=\"tabs\" role=\"tablist\" aria-label=\"Sesiones del proyecto\">\n        <sc-for list=\"{{ws.tabs}}\" as=\"t\" hint-placeholder-count=\"3\">\n          <button class=\"tab {{t.on}}\" role=\"tab\" sc-camel-on-click=\"{{t.pick}}\"><span class=\"tool sm {{t.cls}}\">{{t.mono}}<\u002Fspan>{{t.label}}<sc-if value=\"{{t.spin}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"spin acc\"><\u002Fspan><\u002Fsc-if><sc-if value=\"{{t.hasDot}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"dot {{t.st}}\"><\u002Fspan><\u002Fsc-if><\u002Fbutton>\n        <\u002Fsc-for>\n        <span style=\"flex: 1\"><\u002Fspan>\n        <button class=\"b  style=\"flex: 1\" role=\"log\" aria-label=\"Salida de la sesión\">\n        <sc-for list=\"{{ws.sess.lines}}\" as=\"l\" hint-placeholder-count=\"6\"><div class=\"tl {{l.cls}}\"><span class=\"g\">{{l.g}}<\u002Fspan><span>{{l.t}}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n        <sc-if value=\"{{ws.sess.spin}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"tl acc\"><span class=\"g\"><span class=\"spin\" style=\"display: inline-block; vertical-align: -1px\"><\u002Fspan><\u002Fspan><span class=\"pulse\">{{ws.sess.nowDoing}}<\u002Fspan><\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv>\n      <sc-if value=\"{{ws.sess.isDone}}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-top: 1px solid var(--sep); background: var(--ok-a); flex-wrap: wrap; flex: none\">\n          <span class=\"ic i-check c-ok\"><\u002Fspan>\n          <div style=\"flex: 1; min-width: 200px\"><div style=\"font-weight: 700\">{{ws.sess.resTitle}}<\u002Fdiv><div class=\"cap dim\">{{ws.sess.resSub}}<\u002Fdiv><\u002Fdiv>\n          <button class=\"btn sm\" sc-camel-on-click=\"{{dlg.diff}}\"><span class=\"ic i-diff\"><\u002Fspan>Revisar cambios<\u002Fbutton>\n          <sc-if value=\"{{ws.sess.canSave}}\" hint-placeholder-val=\"{{ false }}\"><button class=\"btn sm sug\" sc-camel-on-click=\"{{dlg.saveMem}}\"><span class=\"ic i-bookmark\"><\u002Fspan>Guardar en Cerebro…<\u002Fbutton><\u002Fsc-if>\n          <sc-if value=\"{{ws.sess.saved}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"st done\"><span class=\"ic i-check\"><\u002Fspan>Documentado<\u002Fspan><\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fsection>\n\n    <!-- Derecha: contexto o supervisión -->\n    <sc-if value=\"{{ws.showCtx}}\" hint-placeholder-val=\"{{ true }}\">\n      <div class=\"handle col-ctx\" role=\"separator\" aria-orientation=\"vertical\"><\u002Fdiv>\n      <section class=\"pane col-ctx\" style=\"width: 290px; flex: none; background: var(--win)\" aria-label=\"Contexto del proyecto\">\n        <div class=\"pane-h\" style=\"justify-content: center; padding: 0 8px\">\n          <div class=\"seg\" role=\"tablist\" style=\"width: 100%\"><button class=\"btn {{ws.ctxTasksOn}}\" style=\"flex: 1\" sc-camel-on-click=\"{{ctxTab.tasks}}\">Tareas<\u002Fbutton><button class=\"btn {{ws.ctxMemOn}}\" style=\"flex: 1\" sc-camel-on-click=\"{{ctxTab.mem}}\">Memoria<\u002Fbutton><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"scroll\" style=\"flex: 1; padding: 12px\">\n          <sc-if value=\"{{ws.ctxTasks}}\" hint-placeholder-val=\"{{ true }}\">\n            <div class=\"boxed\">\n              <sc-for list=\"{{ws.tasks}}\" as=\"t\" hint-placeholder-count=\"3\">\n                <button class=\"row act\" style=\"min-height: 56px\" sc-camel-on-click=\"{{t.open}}\">\n                  <div class=\"grow\"><div class=\"ttl\" style=\"font-weight: 600; font-size: 13.5px\">{{t.title}}<\u002Fdiv><div class=\"sub\" style=\"display: flex; gap: 6px; align-items: center\"><span class=\"dot {{t.dot}}\"><\u002Fspan>{{t.stageName}} · {{t.agentName}}<\u002Fdiv><\u002Fdiv>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <sc-if value=\"{{ws.noTasks}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"status\" style=\"padding: 24px 8px\"><span class=\"ic xl i-tasks\"><\u002Fspan><div class=\"hd\">Sin tareas<\u002Fdiv><div class=\"cap dim\">Transfiere un prompt para crear la primera.<\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n            <div class=\"cap-hd dim\" style=\"padding: 18px 4px 8px\">Resultados recientes<\u002Fdiv>\n            <div class=\"boxed\">\n              <sc-for list=\"{{ws.results}}\" as=\"r\">\n                <div class=\"row\" style=\"min-height: 52px\"><span class=\"ic {{r.icon}} {{r.cls}}\"><\u002Fspan><div class=\"grow\"><div class=\"ttl\" style=\"font-size: 13.5px\">{{r.t}}<\u002Fdiv><div class=\"sub\">{{r.s}}<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ws.ctxMem}}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"cap-hd dim\" style=\"padding: 0 4px 8px\">Estado actual<\u002Fdiv>\n            <div class=\"card\" style=\"padding: 12px; font-size: 13.5px; line-height: 1.5\">{{ws.memState}}<\u002Fdiv>\n            <div class=\"cap-hd dim\" style=\"padding: 16px 4px 8px\">Próximos pasos<\u002Fdiv>\n            <div class=\"boxed\">\n              <sc-for list=\"{{ws.memNext}}\" as=\"n\"><div class=\"row\" style=\"min-height: 44px; font-size: 13.5px\"><span class=\"ic i-chev-right dim\"><\u002Fspan><div class=\"grow\">{{n}}<\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n            <\u002Fdiv>\n            <div class=\"cap-hd dim\" style=\"padding: 16px 4px 8px\">Reglas para agentes<\u002Fdiv>\n            <div class=\"boxed\">\n              <sc-for list=\"{{ws.memRules}}\" as=\"n\"><div class=\"row\" style=\"min-height: 44px; font-size: 13.5px\"><span class=\"ic i-shield dim\"><\u002Fspan><div class=\"grow\">{{n}}<\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n            <\u002Fdiv>\n            <button class=\"btn flat\" style=\"width: 100%; margin-top: 12px\" sc-camel-on-click=\"{{go.memory}}\"><span class=\"ic i-memory\"><\u002Fspan>Abrir Cerebro compartido<\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ws.showMon}}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"handle\" role=\"separator\" aria-orientation=\"vertical\"><\u002Fdiv>\n      <section class=\"pane\" style=\"width: 330px; flex: none; background: var(--win)\" aria-label=\"Supervisión de otro proyecto\">\n        <div class=\"pane-h\">\n          <div class=\"hd\"><span style=\"width: 20px; height: 20px; border-radius: 5px; display: grid; place-items: center; font-size: 9px; font-weight: 800; color: #fff; background: {{mon.p.color}}\">{{mon.p.ini}}<\u002Fspan>{{mon.  font-size: 12px\" class=\"dim\">{{hi.sel.filePath}}<\u002Fdiv>\n              <sc-for list=\"{{hi.sel.diff}}\" as=\"d\"><div class=\"dl {{d.k}}\"><span class=\"n\">{{d.n}}<\u002Fspan><span class=\"c\">{{d.t}}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{hi.sel.noFiles}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"status\" style=\"flex: 1\"><span class=\"ic xl {{hi.sel.noFilesIcon}}\"><\u002Fspan><div class=\"t3\">{{hi.sel.noFilesTitle}}<\u002Fdiv><div class=\"dim\" style=\"max-width: 420px\">{{hi.sel.noFilesText}}<\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n      <\u002Fsc-if>\n      <sc-if value=\"{{hi.vTests}}\" hint-placeholder-val=\"{{ false }}\">\n        <div class=\"scroll\" style=\"flex: 1; padding: 16px 20px\">\n          <div class=\"boxed\"><sc-for list=\"{{hi.sel.tests}}\" as=\"t\"><div class=\"row\" style=\"min-height: 46px\"><span class=\"ic {{t.icon}} {{t.cls}}\"><\u002Fspan><div class=\"grow mono\" style=\"font-size: 13px\">{{t.name}}<\u002Fdiv><span class=\"cap dim num\">{{t.r}}<\u002Fspan><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n          <sc-if value=\"{{hi.sel.noTests}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"status\"><span class=\"ic xl i-tests\"><\u002Fspan><div class=\"t3\">No se ejecutaron pruebas<\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{hi.vAppr}}\" hint-placeholder-val=\"{{ false }}\">\n        <div class=\"scroll\" style=\"flex: 1; padding: 16px 20px\">\n          <div class=\"boxed\"><sc-for list=\"{{hi.sel.approvals}}\" as=\"a\"><div class=\"row\" style=\"min-height: 60px\"><span class=\"ic i-shield {{a.cls}}\"><\u002Fspan><div class=\"grow\"><div class=\"mono ttl\" style=\"font-size: 13px\">{{a.cmd}}<\u002Fdiv><div class=\"sub\">{{a.who}}<\u002Fdiv><\u002Fdiv><span class=\"st {{a.st}}\">{{a.stl}}<\u002Fspan><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n          <sc-if value=\"{{hi.sel.no er}}\"><span class=\"ic i-send\"><\u002Fspan>Transferir a {{ws.pick.name}}<\u002Fbutton><\u002Fdiv>\n      <div class=\"scroll\" style=\"padding: 18px 20px 22px; display: flex; flex-direction: column; gap: 16px\">\n        <div>\n          <div class=\"cap-hd dim\" style=\"margin-bottom: 8px\">Prompt<\u002Fdiv>\n          <div class=\"term\" style=\"border-radius: 10px; max-height: 170px; font-size: 12px\">{{ws.prompt}}<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"boxed\">\n          <div class=\"row\"><span class=\"tool {{ws.pick.cls}}\">{{ws.pick.mono}}<\u002Fspan><div class=\"grow\"><div style=\"font-weight: 600\">{{ws.pick.name}}<\u002Fdiv><div class=\"sub\">Lista · se ejecuta en {{ws.p.path}}<\u002Fdiv><\u002Fdiv><span class=\"st idle\">Nueva sesión<\u002Fspan><\u002Fdiv>\n          <div class=\"row\"><div class=\"grow\"><div>Adjuntar memoria del proyecto<\u002Fdiv><div class=\"sub\">Arquitectura, reglas y estado actual vía AGENTS.md<\u002Fdiv><\u002Fdiv><button class=\"sw on\" role=\"switch\" aria-checked=\"true\" aria-label=\"Adjuntar memoria\"><\u002Fbutton><\u002Fdiv>\n          <div class=\"row\"><div class=\"grow\"><div>Incluir conversación de origen<\u002Fdiv><div class=\"sub\">Plan: mantenimiento preventivo · resumen<\u002Fdiv><\u002Fdiv><button class=\"sw on\" role=\"switch\" aria-checked=\"true\" aria-label=\"Incluir conversación\"><\u002Fbutton><\u002Fdiv>\n          <div class=\"row\"><div class=\"grow\"><div>Pedir aprobación antes de operaciones sensibles<\u002Fdiv><div class=\"sub\">Migraciones, borrado de archivos, git push, instalación de paquetes<\u002Fdiv><\u002Fdiv><button class=\"sw on\" role=\"switch\" aria-checked=\"true\" aria-label=\"Pedir aprobación\"><\u002Fbutton><\u002Fdiv>\n        <\u002Fdiv>\n        <p class=\"cap dim\" style=\"margin: 0\">Se crea la tarea «Filtro por estado de mantenimiento» y se vincula a esta sesión. Codex usa su propio inicio de sesión; IA Workspace no necesita claves API.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- Aprobación -->\n  <sc-if value=\"{{dlgIs.approval}}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"dlg alert\" sc-camel-on-click=\"{{stop}}\" role=\"alertdialog\" aria-label=\"Solicitud de aprobación\">\n      <span class=\"ic xl i-shield c-warn\" style=\"width: 48px; height: 48px; mask-size: 48px; -webkit-mask-size: 48px; margin: 0 auto 4px\"><\u002Fspan>\n      <h2 class=\"t2\">¿Permitir este comando?<\u002Fh2>\n      <div class=\"dim\">Claude Code quiere ejecutar en <b style=\"color: var(--fg)\">Sistema Pablo<\u002Fb>:<\u002Fdiv>\n      <div class=\"term\" style=\"border-radius: 8px; text-align: left; font-size: 12.5px; padding: 10px 12px\">npx prisma migrate dev --name facturas_servicios<\u002Fdiv>\n      <div class=\"boxed\" style=\"text-align: left\">\n        <div class=\"row\" style=\"min-height: 44px; font-size: 13px\"><span class=\"dim\" style=\"width: 90px\">Carpeta<\u002Fspan><span class=\"mono grow ttl\">~/Proyectos/sistema-pablo<\u002Fspan><\u002Fdiv>\n        <div class=\"row\" style=\"min-height: 44px; font-size: 13px\"><span class=\"dim\" style=\"width: 90px\">Efecto<\u002Fspan><span class=\"grow\">Crea y aplica una migración en la base local <span class=\"mono\">sistema_pablo_dev<\u002Fspan><\u002Fspan><\u002Fdiv>\n        <div class=\"row\" style=\"min-height: 44px; font-size: 13px\"><span class=\"dim\" style=\"width: 90px\">Riesgo<\u002Fspan><span class=\"grow\"><span class=\"st wait\">Modifica el esquema de la base de datos<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"alert-btns\">\n        <button class=\"btn sug pill\" sc-camel-on-click=\"{{approve}}\">Permitir una vez<\u002Fbutton>\n        <button class=\"btn pill\" sc-camel-on-click=\"{{approveAlways}}\">Permitir siempre en este proyecto<\u002Fbutton>\n        <button class=\"btn pill dest\" sc-camel-on-click=\"{{reject}}\">Rechazar<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- Confirmar detener -->\n  <sc-if value=\"{{dlgIs.stop}}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"dlg alert\" sc-camel-on-click=\"{{stop}}\" role=\"alertdialog\" aria-label=\"Detener sesión\">\n      <h2 class=\"t2\">¿Detener la sesión de Codex?<\u002Fh2>\n      <div class=\"dim\">Los cambios ya escritos se conservan en el árbol de trabajo. La tarea vuelve a «Asignar».<\u002Fdiv>\n      <div style=\"display: flex; gap: 10px; margin-top: 14px\"><button class=\"btn\" style=\"flex: 1; height: 40px\" sc-camel-on-click=\"{{closeDlg}}\">Cancelar<\u002Fbutton><button class=\"btn dest-solid\" style=\"flex: 1; height: 40px\" sc-camel-on-click=\"{{confirmStop}}\">Detener<\u002Fbutton><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- Diff -->\n  <sc-if value=\"{{dlgIs.diff}}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"dlg\" style=\"max-width: 1000px; height: 100%; max-height: 640px\" sc-camel-on-click=\"{{stop}}\" role=\"dialog\" aria-label=\"Revisar cambios\">\n      <div class=\"hb\"><span style=\"width: 34px\"><\u002Fspan><div class=\"hb-t\"><b>Cambios de Codex · sesión #148<\u002Fb><span>FleetControl · 5 archivos · +142 −18<\u002Fspan><\u002Fdiv><button class=\"btn flat icon\" aria-label=\"Cerrar\" sc-camel-on-click=\"{{closeDlg}}\"><span class=\"ic i-close\"><\u002Fspan><\u002Fbutton><\u002Fdiv>\n      <div style=\"flex: 1; display: flex; min-height: 0\">\n        <div class=\"scroll hide-narrow\" style=\"width: 270px; flex: none; border-right: 1px solid var(--sep); padding: 6px\">\n          <sc-for list=\"{{diffFiles}}\" as=\"f\"><button class=\"nrow {{f.on}}\" style=\"height: 46px\" sc-camel-on-click=\"{{f.pick}}\"><span class=\"ic i-file dim\"><\u002Fspan><span class=\"lbl mono\" style=\"font-size: 12px\">{{f.short}}<\u002Fspan><span class=\"cap c-ok num\">+{{f.a}}<\u002Fspan><span class=\"cap c-err num\">−{{f.d}}<\u002Fspan><\u002Fbutton><\u002Fsc-for>\n        <\u002Fdiv>\n        <div class=\"diff\" style=\"flex: 1; min-width: 0
